<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SST Sistema - Gerenciamento de Riscos</title>
    <meta name="description" content="SST Sistema - Gerenciamento de Riscos. Vistorias técnicas, levantamento de riscos, PGR, PCMSO, LTCAT, laudos e eSocial com Sincronização em Nuvem e PWA." />
    
    <!-- PWA & Mobile Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SST Sistema" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="shortcut icon" href="/icon.svg" />
    <link rel="icon" href="/icon.svg" />

    <meta property="og:title" content="SST Sistema - Gerenciamento de Riscos" />
    <meta property="og:description" content="SST Sistema - Gerenciamento de Riscos com Sincronização em Nuvem e PWA." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.svg" />

    <!-- Google Fonts: Plus Jakarta Sans (Padronização Tipográfica Moderna) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />

    <!-- Google Identity Services for Mobile & Desktop OAuth -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0f172a;
        color: #f8fafc;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        z-index: 9999;
      }
      .loader-spinner {
        width: 44px;
        height: 44px;
        border: 4px solid rgba(16, 185, 129, 0.2);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root">
      <div id="app-loader">
        <img src="/icon.svg" style="width: 58px; height: 58px; margin-bottom: 12px; border-radius: 14px; box-shadow: 0 4px 20px rgba(16, 185, 129, 0.2);" alt="SST Sistema" />
        <div class="loader-spinner"></div>
        <div style="font-weight: 700; font-size: 18px; letter-spacing: -0.02em; margin-bottom: 4px;">SST Sistema</div>
        <div style="font-size: 12px; color: #a7f3d0; opacity: 0.95; font-weight: 500;">Gerenciamento de Riscos</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
